name: CI pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build_backend:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to github container registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.CR }}

    - name: Build the Docker image
      run: | 
          docker build ./backend \
          --file ./backend/Dockerfile \
          --tag ghcr.io/touadiimene/backend:${{ github.sha }} \
          --tag ghcr.io/touadiimene/backend:latest \
          

    - name: Push the Docker image
      run: |
          docker push ghcr.io ./touadiimene/backend:${{ github.sha }}
          docker push ghcr.io ./touadiimene/backend:latest
      

  build_frontend:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to github container registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.CR }}

    - name: Build the Docker image
      run: | 
          docker build ./frontend \
          --file ./frontend/Dockerfile \
          --tag ghcr.io/touadiimene/frontend:${{ github.sha }} \
          --tag ghcr.io/touadiimene/frontend:latest \
          

    - name: Push the Docker image
      run: |
          docker push ghcr.io ./touadiimene/frontend:${{ github.sha }}
          docker push ghcr.io ./touadiimene/frontend:latest
      